<!DOCTYPE html>
<html lang="en">
  {% include head.html %}
  <body>
    <div class="container content">
      <header class="masthead">
        {% include path.html %}
        {%- if page.date %}
        <time class="masthead-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y-%m-%d' }}</time>
        {%- endif %}
      </header>
      <hr>

      <main>
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
    {%- if page.title == 'Home' %}
    <script src="/assets/js/cycler.js" defer></script>
    {%- endif %}
    {%- if page.title == 'Now' %}
    <script src="/assets/js/now.js" defer></script>
    {%- endif %}
  </body>
</html>
